<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baon Buddy</title>
    <style>
      #preloader {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
    
      .loading-screen {
        background: linear-gradient(135deg, #281e6e, #332A79, #673397);
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .floating-cont {
        position: relative;
        animation: float 2s ease-in-out infinite;
        z-index: 999;
      }

      .sandwich {
        width: 120px;
        height: auto;
        z-index: 999;
      }

      .shadow {
        position: absolute;
        bottom: -15px;
        left: 25%;
        width: 60px;
        height: 12px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
      }

      .app-title {
        margin-top: 2rem;
        width: 100%;
        max-width: 200px;
        display: block;
      }

      @keyframes float {
        0% {transform: translateY(0)}
        50% {transform: translateY(-12px)}
        100% {transform: translateY(0)}
      }

      @keyframes pulse {
        0%, 100% {transform: scale(1.4); opacity: 0.4;}
        50% {transform: scale(1); opacity: 0.2;}
      }

      /* Stars, Twinkling, and Clouds Styling */
      .stars-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
      }

      .circle-star {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        opacity: 0.6;
        animation: twinkle 2s infinite ease-in-out;
        z-index: 3;
      }

      .sparkle-star {
        position: absolute;
        width: 20px;
        height: 20px;
        opacity: 0.7;
        animation: twinkle 3s infinite ease-in-out;
        z-index: 1;
      }

      @keyframes twinkle {
        0%, 100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      /* BG flowy lines */
      .flow-lines-bg {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.32;
      }

      .flow-lines-bg svg {
        width: 100%;
        height: 100%;
      }

      .flow-svg {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      .flow-fill {
        fill: #231d52a9; /* very subtle white */
      }

      /* Dust Particles */
      .dust-layer {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .dust {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.08);
        animation: floatDust linear infinite;
      }

      @keyframes floatDust {
        0% { transform: translateX(0) translateY(0); opacity: 0.2; }
        50% { opacity: 0.6; }
        100% { transform: translateX(-100vw) translateY(-100vh); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="loading-screen">
        <div class="floating-cont">
          <img src="/baon/TunaSandwich.png" alt="Tuna Sandwich" class="sandwich">
          <div class="shadow"></div>
        </div>
    
        <img src="/titles/BaonBuddyTitle.png" alt="Baon Buddy" class="app-title">
    
        <!-- Simple sparkles -->
        <div class="stars-bg">
          <!-- Tiny sparkles -->
          <div class="circle-star" style="top: 10%; left: 15%; animation-delay: 0.5s;"></div>
          <div class="circle-star" style="top: 20%; left: 50%; animation-delay: 1.2s;"></div>
          <div class="circle-star" style="top: 60%; left: 70%; animation-delay: 0.9s;"></div>
          <div class="circle-star" style="top: 80%; left: 30%; animation-delay: 1.6s;"></div>
          <div class="circle-star" style="top: 35%; left: 80%; animation-delay: 1s;"></div>
        </div>
    
        <div class="dust-layer">
          <div class="dust" style="top:10%;left:10%;animation-delay:1s"></div>
          <div class="dust" style="top:60%;left:80%;animation-delay:2s"></div>
          <div class="dust" style="top:30%;left:50%;animation-delay:3s"></div>
        </div>

        <!-- Simple background flowy lines -->
        <div class="flow-lines-bg">
          <!-- Layer 1 -->
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="flow-svg" style="top: -250px;">
            <path
              d="M0,40 C25,20 75,60 100,40 L100,60 C75,80 25,20 0,60 Z"
              class="flow-fill"
            />
          </svg>
        
          <!-- Layer 2 -->
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="flow-svg" style="top: 20px;">
            <path
              d="M0,40 C40,20 70,70 100,40 L100,60 C20,80 70,50 0,60 Z"
              class="flow-fill"
            />
          </svg>
        
          <!-- Layer 3 -->
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="flow-svg" style="top: 340px;">
            <path
              d="M0,40 C20,15 80,65 100,40 L100,60 C70,85 30,15 0,60 Z"
              class="flow-fill"
            />
          </svg>
        </div>
      </div>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
